# ==============================================================================
# NETLIFY PRODUCTION DEPLOYMENT CONFIGURATION
# High-performance static edge deployment with HTTP/2, Brotli, and edge caching
# ==============================================================================

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# ------------------------------------------------------------------------------
# ROUTE REDIRECTS
# ------------------------------------------------------------------------------

# Serve /api/contact directly as static JSON
[[redirects]]
  from = "/api/contact"
  to = "/api/contact"
  status = 200

# Custom 404 page handler
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ------------------------------------------------------------------------------
# HIGH-PERFORMANCE CDN CACHING & SECURITY HEADERS
# ------------------------------------------------------------------------------

# 1. Next.js hashed static bundles: Cache indefinitely (1 year) with immutable flag
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 2. Optimized static assets (fonts, images, media)
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# 3. API endpoints: Instant Edge JSON delivery with CORS
[[headers]]
  for = "/api/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# 4. Global security & browser optimization headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
