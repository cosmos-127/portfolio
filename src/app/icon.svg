<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Obsidian Space -->
    <radialGradient id="bgObsidian" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141a27" />
      <stop offset="60%" stop-color="#080b11" />
      <stop offset="100%" stop-color="#030406" />
    </radialGradient>

    <!-- Ambient Crimson Glow for Core -->
    <radialGradient id="coreBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d5a" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#e63946" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#e63946" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#e63946" stop-opacity="0" />
    </radialGradient>

    <!-- Faceted Crimson Diamond Gradients -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b76" />
      <stop offset="45%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#a31422" />
    </linearGradient>

    <!-- Specular Rim Gradient for Squircle Frame -->
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="45%" stop-color="rgba(230, 57, 70, 0.45)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.06)" />
    </linearGradient>

    <!-- Precision Stroke Gradient for G -->
    <linearGradient id="gStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Cutout Mask for Architectural Facet Gap -->
    <mask id="diamondCutout">
      <rect width="512" height="512" fill="white" />
      <polygon points="256,184 326,256 256,328 186,256" fill="black" />
    </mask>
  </defs>

  <!-- Squircle Backdrop -->
  <rect width="512" height="512" rx="116" fill="url(#bgObsidian)" />
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#specularRim)" stroke-width="2.5" />

  <!-- Ambient Crimson Radiation Glow -->
  <circle cx="256" cy="256" r="150" fill="url(#coreBloom)" />

  <!-- Monogram G Track -->
  <path
    d="M 358 154
       A 144 144 0 1 0 400 256
       L 256 256"
    fill="none"
    stroke="url(#gStroke)"
    stroke-width="50"
    stroke-linecap="round"
    stroke-linejoin="round"
    mask="url(#diamondCutout)"
  />

  <!-- Central 3D Faceted Tensor Core -->
  <polygon points="256,196 314,256 256,316 198,256" fill="url(#diamondGrad)" />
  <polygon points="256,196 314,256 256,256" fill="#ffffff" fill-opacity="0.34" />
  <polygon points="256,196 198,256 256,256" fill="#ffffff" fill-opacity="0.14" />
  <polygon points="198,256 256,316 256,256" fill="#000000" fill-opacity="0.22" />
  <polygon points="256,196 314,256 256,316 198,256" fill="none" stroke="#ff949d" stroke-width="3" stroke-linejoin="round" />
  <circle cx="256" cy="256" r="7.5" fill="#ffffff" />
</svg>